<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sua senha foi alterada</title>
  </head>
  <body style="margin: 0; background: #f8f7f3; color: #343d35; font-family: Arial, sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            style="
              max-width: 560px;
              background: white;
              border: 1px solid #e8e3d9;
              border-radius: 16px;
            "
            cellpadding="0"
            cellspacing="0"
          >
            <tr>
              <td style="padding: 32px">
                <p style="color: #596d50; font-weight: bold; font-size: 20px; margin: 0 0 32px">
                  OrganizaCasamento
                </p>
                <h1 style="font-size: 26px; line-height: 1.3">Sua senha foi alterada</h1>
                <p style="font-size: 16px; line-height: 1.7">
                  A senha da conta <strong>{{ .Email }}</strong> foi alterada. Use a nova senha nos
                  próximos acessos.
                </p>
                <p style="margin: 28px 0">
                  <a
                    href="{{ .SiteURL }}/acesso/recuperar"
                    style="
                      display: inline-block;
                      background: #596d50;
                      color: white;
                      text-decoration: none;
                      padding: 16px 22px;
                      border-radius: 8px;
                      font-weight: bold;
                    "
                    >Recuperar minha conta</a
                  >
                </p>
                <p style="font-size: 14px; line-height: 1.7">
                  Se não foi você, use o botão acima para recuperar sua conta imediatamente.
                </p>
                <hr style="border: 0; border-top: 1px solid #e8e3d9; margin: 28px 0" />
                <p style="font-size: 12px; color: #667064">
                  Seu casamento, sem complicação.<br />Nunca pediremos sua senha por e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
